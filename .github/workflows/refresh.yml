name: Daily Market Data Refresh & Validation

on:
  schedule:
    # 17:00 IST Monday to Friday is 11:30 UTC Monday to Friday
    # Cron: minute hour day-of-month month day-of-week (UTC)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Incremental Market Refresh & DQ Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch current database and clean data from data branch
        run: |
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            echo "Checking out data files from origin/data..."
            git checkout origin/data -- data/market.duckdb data/clean/market_clean.parquet || true
          fi
          if [ ! -f "data/market.duckdb" ]; then
            echo "::error::data/market.duckdb not found on 'data' branch. Refusing to silently start full pull."
            exit 1
          fi

      - name: Execute Incremental Market Data Refresh
        run: |
          python -m src.ingest.run --incremental

      - name: Run Data Quality (DQ) Verification Suite
        run: |
          python -m src.ingest.dq_checks --db-path data/market.duckdb

      - name: Run Automated Pytest Suite
        run: |
          pytest -v

      - name: Commit and update data orphan branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-update
          git rm -rf --cached .
          git add -f data/market.duckdb data/clean/market_clean.parquet
          git commit -m "Auto-refresh market data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin data-update:data --force

      - name: Upload Clean Data Artifacts (Backup)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: market-duckdb-and-clean-data
          path: |
            data/market.duckdb
            data/clean/market_clean.parquet
            reports/cleaning_report.md
          retention-days: 30

